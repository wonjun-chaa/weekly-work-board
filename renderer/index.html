<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 업무 보드</title>
<style>
:root {
  --bg: #EDF0ED;
  --surface: #FFFFFF;
  --surface-2: #F5F7F5;
  --ink: #253430;
  --muted: #68776F;
  --line: #D9E0DA;
  --accent: #17766B;
  --accent-soft: #E1EFEA;
  --accent-ink: #0F5A4E;
  --danger: #BF5B4B;
  --warn: #C0913B;
  --on-danger: #FFFFFF;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(31,48,42,.06), 0 4px 12px rgba(31,48,42,.05);
  --shadow-lift: 0 4px 8px rgba(31,48,42,.12), 0 12px 28px rgba(31,48,42,.14);
  --t0b:#DFEBDC; --t0t:#4A6B44;
  --t1b:#D8EBE4; --t1t:#2E6B5C;
  --t2b:#DCE7EE; --t2t:#40667F;
  --t3b:#E1E2F0; --t3t:#585A8C;
  --t4b:#EADFE9; --t4t:#7A5276;
  --t5b:#F0DFDD; --t5t:#8C5450;
  --t6b:#EFE6D6; --t6t:#85683B;
  --t7b:#E3E8E3; --t7t:#5A695F;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141916;
    --surface: #1C231F;
    --surface-2: #222B26;
    --ink: #E5ECE7;
    --muted: #8CA094;
    --line: #31403A;
    --accent: #3FB8A2;
    --accent-soft: #1C342D;
    --accent-ink: #7BD4C0;
    --danger: #D98A77;
    --warn: #D2A75C;
    --on-danger: #2E1B15;
    --on-accent: #10241F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    --shadow-lift: 0 4px 10px rgba(0,0,0,.4), 0 14px 30px rgba(0,0,0,.45);
    --t0b:#2C3A29; --t0t:#B2CCAB;
    --t1b:#22382F; --t1t:#98CDBB;
    --t2b:#263440; --t2t:#A3C2D8;
    --t3b:#2C2D42; --t3t:#B6B8DE;
    --t4b:#3A2C38; --t4t:#D0AECA;
    --t5b:#402E2C; --t5t:#DBAFA9;
    --t6b:#3B3325; --t6t:#D4BB8B;
    --t7b:#303731; --t7t:#AEBCB2;
  }
}
:root[data-theme="dark"] {
  --bg: #141916;
  --surface: #1C231F;
  --surface-2: #222B26;
  --ink: #E5ECE7;
  --muted: #8CA094;
  --line: #31403A;
  --accent: #3FB8A2;
  --accent-soft: #1C342D;
  --accent-ink: #7BD4C0;
  --danger: #D98A77;
  --warn: #D2A75C;
  --on-danger: #2E1B15;
  --on-accent: #10241F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  --shadow-lift: 0 4px 10px rgba(0,0,0,.4), 0 14px 30px rgba(0,0,0,.45);
  --t0b:#2C3A29; --t0t:#B2CCAB;
  --t1b:#22382F; --t1t:#98CDBB;
  --t2b:#263440; --t2t:#A3C2D8;
  --t3b:#2C2D42; --t3t:#B6B8DE;
  --t4b:#3A2C38; --t4t:#D0AECA;
  --t5b:#402E2C; --t5t:#DBAFA9;
  --t6b:#3B3325; --t6t:#D4BB8B;
  --t7b:#303731; --t7t:#AEBCB2;
}
:root[data-theme="light"] {
  --bg: #EDF0ED;
  --surface: #FFFFFF;
  --surface-2: #F5F7F5;
  --ink: #253430;
  --muted: #68776F;
  --line: #D9E0DA;
  --accent: #17766B;
  --accent-soft: #E1EFEA;
  --accent-ink: #0F5A4E;
  --danger: #BF5B4B;
  --warn: #C0913B;
  --on-danger: #FFFFFF;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(31,48,42,.06), 0 4px 12px rgba(31,48,42,.05);
  --shadow-lift: 0 4px 8px rgba(31,48,42,.12), 0 12px 28px rgba(31,48,42,.14);
  --t0b:#DFEBDC; --t0t:#4A6B44;
  --t1b:#D8EBE4; --t1t:#2E6B5C;
  --t2b:#DCE7EE; --t2t:#40667F;
  --t3b:#E1E2F0; --t3t:#585A8C;
  --t4b:#EADFE9; --t4t:#7A5276;
  --t5b:#F0DFDD; --t5t:#8C5450;
  --t6b:#EFE6D6; --t6t:#85683B;
  --t7b:#E3E8E3; --t7t:#5A695F;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Header ---------- */
.topbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 20px;
  padding: 18px 24px 14px;
  max-width: 1560px;
  margin: 0 auto;
}
.brand h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .sub {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}
.weeknav {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.weeknav .range {
  min-width: 190px;
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.weeknav .range small {
  display: block;
  font-weight: 400;
  font-size: 11px;
  color: var(--muted);
}
.chip-now {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 11px;
  font-weight: 600;
  vertical-align: 1px;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.icon { padding: 6px 10px; font-variant-numeric: tabular-nums; }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { background: var(--surface); border-color: var(--line); }

.theme-switch {
  margin-left: 8px;
  width: 52px;
  height: 27px;
  flex: none;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  position: relative;
  padding: 0;
  transition: background .15s ease;
}
.theme-switch::before,
.theme-switch::after {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  line-height: 1;
  opacity: .55;
}
.theme-switch::before { content: '☀'; left: 7px; }
.theme-switch::after { content: '☾'; right: 7px; }
.theme-switch .knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: left .18s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.theme-switch .knob::before { content: '☀'; }
:root[data-theme="dark"] .theme-switch .knob { left: 27px; }
:root[data-theme="dark"] .theme-switch .knob::before { content: '☾'; }

.toolrow {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 0 24px 14px;
  max-width: 1560px;
  margin: 0 auto;
}
.weekstat {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.weekstat .bar {
  width: 140px;
  height: 5px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}
.weekstat .bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width .25s ease;
}
.toolrow .spacer { flex: 1; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.toggle input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

/* ---------- Board ---------- */
.board-wrap {
  overflow-x: auto;
  padding: 0 24px 40px;
}
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(216px, 1fr)) 14px minmax(250px, 1.3fr);
  gap: 12px;
  align-items: start;
  max-width: 1560px;
  margin: 0 auto;
}
.divider {
  align-self: stretch;
  display: flex;
  justify-content: center;
  padding-top: 8px;
}
.divider i {
  width: 1px;
  background: linear-gradient(var(--line) 60%, transparent);
}

/* ---------- Long-term categories (compact, inside the long-term column) ---------- */
.cat-groups {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cat-group-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 4px 6px;
}
.cat-group-head .count {
  flex: none;
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.cat-group-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--muted);
}
.cat-group .cardlist {
  min-height: 30px;
  gap: 6px;
}
.cat-group .add-btn {
  margin-top: 6px;
  padding: 5px;
  font-size: 11.5px;
}
.cat-pill {
  font-size: 12.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  min-width: 0; /* 긴 이름이 헤더를 밀어내지 않도록 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cat-del {
  flex: none;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font-size: 12px;
  color: var(--muted);
  opacity: .5;
  margin-left: 2px;
}
.cat-del:hover { opacity: 1; background: rgba(127,127,127,.25); }
.col.longterm > #addCategoryBtn,
.col.longterm > form { margin-top: 12px; }
.col.longterm > form input[type="text"] {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
}

.col {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
}
.col.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.col.longterm { background: transparent; border-style: dashed; }

.col-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 2px 4px 8px;
}
.col-head .day {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
}
.col.today .col-head .day { color: var(--accent-ink); }
.col-head .date {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.col-head .today-chip {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-radius: 99px;
  padding: 1px 7px;
}
.col-head .count {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
/* 공휴일인 요일 열 — 열 배경을 바꾸고 머리에 이름 띠를 얹는다 */
.col.holiday {
  background: color-mix(in srgb, var(--danger) 11%, var(--surface-2));
  border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
}
.col.holiday.today { border-color: var(--accent); }
.col.holiday .col-head .date { color: var(--danger); }
.col-holiday {
  margin: -2px 0 8px;
  padding: 3px 8px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--danger) 24%, var(--surface));
  color: color-mix(in srgb, var(--danger) 80%, var(--ink));
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  text-align: center;
}
.col-progress {
  height: 3px;
  border-radius: 99px;
  background: var(--line);
  margin: 0 4px 10px;
  overflow: hidden;
}
.col-progress i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width .25s ease;
}

.cardlist {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 60px;
  flex: 1;
}
.cardlist.dragover {
  background: var(--accent-soft);
  border-radius: 8px;
}
.drop-indicator {
  height: 3px;
  border-radius: 99px;
  background: var(--accent);
  margin: -2px 2px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: var(--shadow);
  cursor: grab;
  transition: box-shadow .12s ease, transform .12s ease, opacity .12s ease;
}
.card:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.card.dragging { opacity: .35; }
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.card-check {
  flex: none;
  margin-top: 2px;
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}
.card-title {
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.4;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.prio-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: 1px;
}
.prio-high .prio-dot { background: var(--danger); }
.prio-mid .prio-dot { background: var(--warn); }
.due-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 99px;
  white-space: nowrap;
  color: var(--muted);
  background: var(--line);
  font-variant-numeric: tabular-nums;
}
.due-chip.urgent { color: var(--on-danger); background: var(--danger); }
.card.due-soon {
  border-color: var(--danger);
  box-shadow: 0 0 0 1.5px var(--danger), var(--shadow);
}
.carry-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 99px;
  white-space: nowrap;
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 16%, transparent);
  font-variant-numeric: tabular-nums;
}
.sub-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 99px;
  white-space: nowrap;
  color: var(--muted);
  background: var(--line);
  font-variant-numeric: tabular-nums;
}
.sub-chip.all-done { color: var(--accent-ink); background: var(--accent-soft); }
.card-memo {
  margin: 5px 0 0 24px;
  font-size: 12px;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.card-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap; /* 칩이 여러 개여도 카드 밖으로 나가지 않게 */
  gap: 5px 6px;
  margin: 7px 0 0 24px;
}
.card-meta > * { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 99px;
  max-width: min(140px, 100%);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tc0 { background: var(--t0b); color: var(--t0t); }
.tc1 { background: var(--t1b); color: var(--t1t); }
.tc2 { background: var(--t2b); color: var(--t2t); }
.tc3 { background: var(--t3b); color: var(--t3t); }
.tc4 { background: var(--t4b); color: var(--t4t); }
.tc5 { background: var(--t5b); color: var(--t5t); }
.tc6 { background: var(--t6b); color: var(--t6t); }
.tc7 { background: var(--t7b); color: var(--t7t); }

/* ---------- tag filter ---------- */
.tagfilter {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.tagfilter .flabel { font-size: 12px; color: var(--muted); margin-right: 2px; }
.fchip {
  border: none;
  border-radius: 99px;
  padding: 3px 11px;
  font-size: 12px;
  font-weight: 600;
  opacity: .72;
  transition: opacity .12s ease, box-shadow .12s ease;
}
.fchip:hover { opacity: 1; }
.fchip.on { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.fchip.all { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.fchip.all.on { border-color: transparent; color: var(--ink); }

/* ---------- tag picker in modal ---------- */
.tag-suggest {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.tag-suggest button {
  border: none;
  border-radius: 99px;
  padding: 3px 6px 3px 11px;
  font-size: 12px;
  font-weight: 600;
  opacity: .85;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tag-suggest button:hover { opacity: 1; }
.tag-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  font-size: 11px;
  line-height: 1;
  opacity: .5;
}
.tag-suggest button:hover .tag-x { opacity: .85; }
.tag-x:hover { opacity: 1 !important; background: rgba(127,127,127,.25); }
.swatch-label {
  margin: 12px 0 6px;
  font-size: 11.5px;
  color: var(--muted);
}
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid rgba(127,127,127,.25);
  padding: 0;
  transition: transform .1s ease, box-shadow .1s ease;
}
.swatch:hover { transform: scale(1.12); }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.card.done { opacity: .55; }
.card.done .card-title { text-decoration: line-through; text-decoration-color: var(--muted); font-weight: 400; }

.add-btn {
  margin-top: 8px;
  border: 1px dashed var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  padding: 7px;
  font-size: 12.5px;
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
.add-btn:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

.empty-hint {
  padding: 14px 6px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  opacity: .7;
}

/* ---------- View tabs (주간 / 월간) ---------- */
.tabs {
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
}
.tab {
  border: none;
  background: transparent;
  border-radius: 7px;
  padding: 5px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  transition: background .12s ease, color .12s ease;
}
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* 숨길 때만 display:none; 평소에는 자식이 .toolrow 플렉스에 직접 참여 */
.toolgroup { display: contents; }

/* ---------- Month board ---------- */
.month-wrap { overflow-x: auto; padding: 0 24px 40px; }
.calendar { max-width: 1560px; min-width: 760px; margin: 0 auto; }
.cal-dow, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.cal-dow { margin-bottom: 8px; }
.cal-dow span {
  text-align: center;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
}
.cal-dow span.off { opacity: .55; }
.cal-cell {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 112px;
  padding: 7px 8px 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color .12s ease, box-shadow .12s ease, transform .12s ease;
}
.cal-cell:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.cal-cell.weekend { background: var(--surface-2); }
.cal-cell.other { background: transparent; border-style: dashed; opacity: .5; }
.cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cal-daynum {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.cal-cell.weekend .cal-daynum { color: var(--muted); }
.cal-cell.today .cal-daynum { color: var(--accent-ink); }
/* 공휴일은 오늘 표시보다 뒤에 둬야 빨간 날짜가 이긴다 */
.cal-cell.holiday .cal-daynum > span:first-child { color: var(--danger); }
.cal-daynum .today-chip { font-size: 10px; padding: 0 6px; }
.cal-daynum .hol-name {
  min-width: 0;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--danger);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-stats {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.stat-done, .stat-todo { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.stat-done { color: var(--accent-ink); }
.stat-todo { color: var(--danger); }
.stat-done i, .stat-todo i { width: 8px; height: 8px; border-radius: 50%; }
.stat-done i { background: var(--accent); }
.stat-todo i { background: var(--danger); }
.stat-lt { color: var(--muted); font-weight: 700; }
.sched-bar {
  min-width: 0;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sched-more { font-size: 11px; color: var(--muted); padding-left: 2px; }
.sc-delivery { background: var(--t5b); color: var(--t5t); }
.sc-meeting { background: var(--t1b); color: var(--t1t); }
.sc-trip { background: var(--t2b); color: var(--t2t); }
.sc-etc { background: var(--t7b); color: var(--t7t); }
.sc-vacation { background: var(--t6b); color: var(--t6t); }
/* 휴가인 날은 칸 자체를 옅게 물들여 2줄 미리보기에서 밀려도 보이게 한다 */
.cal-cell.vac { background: color-mix(in srgb, var(--t6b) 42%, var(--surface)); }
.cal-cell.vac.weekend { background: color-mix(in srgb, var(--t6b) 42%, var(--surface-2)); }
/* 공휴일은 칸 배경까지 바꾼다 — 빨간 글자만으로는 눈에 안 들어온다.
 * 휴가 틴트보다 뒤에 둬서 둘 다 걸리면 공휴일이 이긴다. */
.cal-cell.holiday,
.cal-cell.holiday.weekend,
.cal-cell.holiday.vac {
  background: color-mix(in srgb, var(--danger) 15%, var(--surface));
  border-color: color-mix(in srgb, var(--danger) 38%, var(--line));
}
/* 공휴일 이름은 배경 위에서 더 또렷하게 */
.cal-cell.holiday .hol-name { color: color-mix(in srgb, var(--danger) 78%, var(--ink)); }
/* 오늘이 공휴일이어도 '오늘' 테두리는 유지 */
.cal-cell.holiday.today { border-color: var(--accent); }

/* ---------- 일정 드래그 이동 ---------- */
.sched-bar[data-sid] { cursor: grab; }
.sched-bar[data-sid]:active { cursor: grabbing; }
.sched-bar.dragging { opacity: .4; }
/* 놓았을 때 걸칠 범위를 미리 칠한다. 배경 대신 inset 그림자를 쓰는 건
 * 공휴일·휴가 배경 규칙(.cal-cell.holiday.vac 등)과 특이도 싸움을 피하려고. */
.cal-cell.sd-range {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  box-shadow: inset 0 0 0 200px color-mix(in srgb, var(--accent) 10%, transparent);
}
.cal-cell.sd-target {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 200px color-mix(in srgb, var(--accent) 18%, transparent),
              0 0 0 1px var(--accent);
}
/* 끌고 다니는 동안 칸이 들썩이면 조준이 어렵다 */
.cal-grid.sd-on .cal-cell:hover { transform: none; }

/* ---------- 휴가 카운터 ---------- */
/* margin-left:auto — 다가오는 일정 줄이 길어 툴바가 접히면 .spacer가 첫 줄에
 * 남아, 둘째 줄로 떨어진 휴가 칩과 뒤 버튼들이 왼쪽에 붙어 버린다. 접힌 줄의
 * 남은 공간을 auto 마진으로 먹여 늘 오른쪽에 붙인다(안 접히면 .spacer가 이미
 * 다 가져가 남는 공간이 0이라 영향 없음). */
.vac-chip {
  display: inline-flex;
  align-items: baseline;
  margin-left: auto;
  padding: 4px 12px;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.vac-chip .lbl {
  margin-right: 7px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--muted);
}
.vac-chip .num { font-size: 15px; font-weight: 700; color: var(--accent-ink); }
.vac-chip .unit { margin-left: 1px; font-size: 11.5px; color: var(--muted); }
.vac-chip .sub { margin-left: 8px; font-size: 11px; color: var(--muted); opacity: .85; }
/* 지나간 '사용'과 앞으로 쓸 '예정'을 한 줄에 나란히 두므로 예정만 액센트로 구분 */
.vac-chip .sub .plan { color: var(--accent-ink); opacity: .8; }
.vac-chip.low .num { color: var(--warn); }
.vac-chip.over .num { color: var(--danger); }
.vac-chip.unset .num { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.leave-tag { flex: none; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.vac-note {
  margin: -6px 0 14px;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}

/* ---------- D-day strip ---------- */
.dday { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.dday .flabel { font-size: 12px; color: var(--muted); margin-right: 2px; }
.dday-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 11px 2px 3px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  font-size: 12.5px;
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
}
.dday-item:hover { border-color: var(--accent); }
.dday-badge {
  flex: none;
  padding: 1px 8px;
  border-radius: 99px;
  background: var(--line);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.dday-item.soon .dday-badge { background: var(--danger); color: var(--on-danger); }
.dday-type { flex: none; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.dday-item .ttl { overflow: hidden; text-overflow: ellipsis; }
.dday-empty { font-size: 12.5px; color: var(--muted); }

/* ---------- Day detail panel ---------- */
.modal.wide { max-width: 470px; }
.day-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 16px; }
.day-head h2 { margin: 0; font-size: 16px; }
.day-head .dow { font-size: 12px; color: var(--muted); }
.day-head .hol-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 99px;
  color: var(--on-danger);
  background: var(--danger);
}
.day-sec { margin-bottom: 16px; }
.day-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.day-sec-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--muted);
}
.day-sec-head .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.day-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 10px;
  margin-bottom: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
}
.day-row.clickable { cursor: pointer; }
.day-row.clickable:hover { border-color: var(--accent); background: var(--accent-soft); }
.day-row .dday-type { margin-top: 1px; }
.day-row .card-check { margin-top: 2px; }
.day-row .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.day-row .t small {
  display: block;
  margin-top: 2px;
  font-weight: 400;
  font-size: 11.5px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.day-row.done .t {
  color: var(--muted);
  font-weight: 400;
  text-decoration: line-through;
  text-decoration-color: var(--muted);
}
.day-row.done .t small { text-decoration: none; }
.day-empty { padding: 2px 2px 6px; font-size: 12px; color: var(--muted); opacity: .85; }

/* ---------- Modal ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(14,20,26,.45);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 9vh 16px 16px;
  overflow-y: auto; /* 하위 업무가 많아 모달이 길어지면 스크롤 */
  z-index: 50;
}
.overlay.open { display: flex; }
/* 날짜 상세 패널 위에 겹쳐 뜨는 일정 모달 */
.overlay.stacked { background: rgba(14,20,26,.3); z-index: 55; }
.modal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-lift);
  width: 100%;
  max-width: 420px;
  padding: 20px;
}
.modal h2 {
  margin: 0 0 16px;
  font-size: 15px;
  font-weight: 700;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .04em;
  margin-bottom: 5px;
}
.field input[type="text"], .field input[type="date"], .field input[type="time"],
.field input[type="number"], .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13.5px;
}
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
/* ---------- subtask list (modal) ---------- */
.subs {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sub-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.sub-check {
  flex: none;
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}
.sub-row input[type="text"] {
  flex: 1;
  width: auto;
  min-width: 0;
  padding: 6px 10px;
  font-size: 13px;
}
.sub-row.done input[type="text"] {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--muted);
}
.sub-del {
  flex: none;
  border: none;
  background: transparent;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 13px;
  line-height: 1;
  color: var(--muted);
  opacity: .5;
}
.sub-del:hover { opacity: 1; background: rgba(127,127,127,.25); }
.sub-add {
  width: 100%;
  margin-top: 6px;
  border: 1px dashed var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  padding: 6px;
  font-size: 12.5px;
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
.sub-add:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

.seg {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.seg button {
  flex: 1;
  border: none;
  background: var(--surface-2);
  padding: 7px 4px;
  font-size: 13px;
  color: var(--muted);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg button.on.seg-high { background: var(--danger); color: var(--on-danger); }
.seg button.on.seg-mid { background: var(--warn); color: #3A2B08; }
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}
.modal-actions .grow { flex: 1; }
.btn.danger-ghost { color: var(--danger); border-color: transparent; background: transparent; }
.btn.danger-ghost:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: transparent; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(8px);
  background: var(--ink);
  color: var(--bg);
  padding: 9px 16px;
  border-radius: 99px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 id="brandTitle">주간 업무 보드</h1>
    <p class="sub" id="brandSub">이번 주에 집중하고, 긴 호흡의 일은 옆에 둡니다</p>
  </div>
  <div class="tabs" role="tablist" aria-label="보드 전환">
    <button class="tab on" id="tabWeek" role="tab" aria-selected="true">주간</button>
    <button class="tab" id="tabMonth" role="tab" aria-selected="false">월간</button>
  </div>
  <nav class="weeknav" id="weekNav" aria-label="주차 이동">
    <button class="btn icon" id="prevWeek" title="지난주">◀</button>
    <div class="range" id="weekRange"></div>
    <button class="btn icon" id="nextWeek" title="다음주">▶</button>
    <button class="btn" id="goToday">오늘</button>
  </nav>
  <nav class="weeknav" id="monthNav" aria-label="월 이동" style="display:none">
    <button class="btn icon" id="prevMonth" title="지난달">◀</button>
    <div class="range" id="monthRange"></div>
    <button class="btn icon" id="nextMonth" title="다음달">▶</button>
    <button class="btn" id="goThisMonth">이번 달</button>
  </nav>
  <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="다크모드 전환">
    <span class="knob"></span>
  </button>
</header>

<div class="toolrow">
  <div class="toolgroup" id="weekTools">
    <div class="weekstat">
      <span id="weekStatText"></span>
      <span class="bar"><i id="weekStatBar" style="width:0%"></i></span>
    </div>
    <div class="tagfilter" id="tagFilter"></div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="hideDone"> 완료 숨기기</label>
    <button class="btn" id="carryOver" title="지난 요일의 미완료 업무를 오늘 열로 이동">미완료 오늘로 이월</button>
  </div>
  <div class="toolgroup" id="monthTools" style="display:none">
    <div class="dday" id="ddayStrip"></div>
    <div class="spacer"></div>
    <button class="btn vac-chip" id="vacChip" title="클릭하여 기준 잔여 휴가 수정"></button>
    <button class="btn primary" id="addSchedBtn">＋ 일정 추가</button>
  </div>
  <button class="btn" id="openCsv" title="월별 CSV 기록 파일이 저장된 폴더 열기">CSV 폴더 열기</button>
</div>

<div class="board-wrap" id="weekView">
  <main class="board" id="board"></main>
</div>

<div class="month-wrap" id="monthView" style="display:none">
  <main class="calendar">
    <div class="cal-dow" aria-hidden="true">
      <span class="off">일</span>
      <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
      <span class="off">토</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <form class="modal" id="cardForm">
    <h2 id="modalTitle">업무 추가</h2>
    <div class="field">
      <label for="fTitle">제목</label>
      <input type="text" id="fTitle" required maxlength="120" placeholder="예: 주간 보고서 작성">
    </div>
    <div class="field">
      <label for="fMemo">메모</label>
      <textarea id="fMemo" maxlength="1000" placeholder="세부 내용, 링크 등 (선택)"></textarea>
    </div>
    <div class="field">
      <label>하위 업무</label>
      <div class="subs" id="fSubs"></div>
      <button type="button" class="sub-add" id="fSubAdd">＋ 하위 업무 추가</button>
    </div>
    <div class="field">
      <label>우선순위</label>
      <div class="seg" id="fPrio">
        <button type="button" data-v="high" class="seg-high">높음</button>
        <button type="button" data-v="mid" class="seg-mid">보통</button>
        <button type="button" data-v="low" class="seg-low on">낮음</button>
      </div>
    </div>
    <div class="field">
      <label for="fDue">마감기한</label>
      <input type="date" id="fDue">
    </div>
    <div class="field">
      <label class="toggle"><input type="checkbox" id="fDone"> 완료 처리</label>
    </div>
    <div class="field" id="fDoneAtField" style="display:none">
      <label for="fDoneAt">완료일</label>
      <input type="date" id="fDoneAt">
    </div>
    <div class="field">
      <label for="fTag">태그</label>
      <input type="text" id="fTag" maxlength="20" placeholder="예: 회의, 보고, 개발 (선택)">
      <div class="tag-suggest" id="fTagList"></div>
      <div class="swatch-label">태그 색상</div>
      <div class="swatches" id="fSwatches"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn danger-ghost" id="fDelete" style="display:none">삭제</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="fCancel">취소</button>
      <button type="submit" class="btn primary" id="fSave">저장</button>
    </div>
  </form>
</div>

<div class="overlay" id="dayOverlay">
  <div class="modal wide" id="dayPanel"></div>
</div>

<div class="overlay stacked" id="schedOverlay">
  <form class="modal" id="schedForm">
    <h2 id="schedModalTitle">일정 추가</h2>
    <div class="field">
      <label for="sTitle">제목</label>
      <input type="text" id="sTitle" required maxlength="120" placeholder="예: 제품 A 납품">
    </div>
    <div class="field">
      <label>유형</label>
      <div class="seg" id="sType">
        <button type="button" data-v="delivery" class="on">납기</button>
        <button type="button" data-v="meeting">미팅</button>
        <button type="button" data-v="trip">출장</button>
        <button type="button" data-v="vacation">휴가</button>
        <button type="button" data-v="etc">기타</button>
      </div>
    </div>
    <div class="field" id="sLeaveField" style="display:none">
      <label>휴가 종류</label>
      <div class="seg" id="sLeave">
        <button type="button" data-v="full" class="on">연차 · 1일</button>
        <button type="button" data-v="half">반차 · 0.5일</button>
      </div>
    </div>
    <div class="field">
      <label for="sStart">시작일</label>
      <input type="date" id="sStart" required>
    </div>
    <div class="field" id="sEndField">
      <label for="sEnd">종료일 <span style="font-weight:400">· 여러 날 걸치는 일정만</span></label>
      <input type="date" id="sEnd">
    </div>
    <div class="field">
      <label for="sTime">시간 <span style="font-weight:400">· 선택</span></label>
      <input type="time" id="sTime">
    </div>
    <div class="field">
      <label for="sMemo">메모</label>
      <textarea id="sMemo" maxlength="1000" placeholder="장소, 참석자, 링크 등 (선택)"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn danger-ghost" id="sDelete" style="display:none">삭제</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="sCancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<div class="overlay stacked" id="vacOverlay">
  <form class="modal" id="vacForm">
    <h2 id="vacModalTitle">잔여 휴가 설정</h2>
    <div class="field">
      <label for="vBase">기준 잔여 휴가 <span style="font-weight:400">· 일 단위, 0.5 가능</span></label>
      <input type="number" id="vBase" min="0" max="365" step="0.5" placeholder="예: 4">
    </div>
    <p class="vac-note" id="vacNote"></p>
    <div class="modal-actions">
      <button type="button" class="btn danger-ghost" id="vReset">기준값 지우기</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="vCancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(async function () {
  'use strict';

  var STORAGE_KEY = 'weekly-work-board-v1';
  var DAYS = [
    { key: 'mon', label: '월' },
    { key: 'tue', label: '화' },
    { key: 'wed', label: '수' },
    { key: 'thu', label: '목' },
    { key: 'fri', label: '금' }
  ];
  var PRIO_LABEL = { high: '높음', mid: '보통', low: '낮음' };

  /* ---------- date utils ---------- */
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var offset = (x.getDay() + 6) % 7; // Mon=0 ... Sun=6
    x.setDate(x.getDate() - offset);
    return x;
  }
  /* 월간 달력은 일–토로 그린다. 주간 보드의 월–금(mondayOf)과는 별개 기준 */
  function sundayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - x.getDay());
    return x;
  }
  function addDays(d, n) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  function keyOf(d) {
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function sameDate(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  /* ---------- state ---------- */
  var state = await load();
  var HOLIDAYS = await loadHolidays(); // { 'YYYY-MM-DD': '추석' }
  var viewMonday = mondayOf(new Date());
  var viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var tagFilter = new Set(); // session-only filter selection
  var TAG_COLORS = 8;
  var addingCategory = false; // inline "add category" input open?

  /* 주간/월간 전환. 월간은 일정(미팅·납기 등) 전용이며, 주간 업무는
   * 요일 칸 위치 기준으로 한일/할일 개수만 요약해 보여준다. */
  var VIEW_KEY = 'weekly-board-view';
  var view = 'week';
  try { if (localStorage.getItem(VIEW_KEY) === 'month') view = 'month'; } catch (e) {}

  state.tagColors = state.tagColors || {};
  ensureTagColors();
  state.longtermCategories = state.longtermCategories || [];
  ensureLongtermCategories();
  state.schedules = state.schedules || [];
  state.vacation = state.vacation || {}; // { 'YYYY': 기준 잔여일(수기 입력) }
  var initialCarry = autoCarryOver();

  function ensureTagColors() {
    var register = function (c) {
      if (c.tag && state.tagColors[c.tag] === undefined) {
        state.tagColors[c.tag] = Object.keys(state.tagColors).length % TAG_COLORS;
      }
    };
    Object.keys(state.weeks).forEach(function (wk) {
      DAYS.forEach(function (d) { (state.weeks[wk][d.key] || []).forEach(register); });
    });
    state.longterm.forEach(register);
  }

  function ensureLongtermCategories() {
    var have = {};
    state.longtermCategories.forEach(function (t) { have[t] = true; });
    state.longterm.forEach(function (c) {
      if (c.tag && !have[c.tag]) {
        state.longtermCategories.push(c.tag);
        have[c.tag] = true;
      }
    });
  }

  /* ---------- auto carry-over of last week(s)' unfinished work ----------
   * On each new week, pull undone weekday cards from every earlier week onto
   * this week's Monday and flag them as delayed. Runs once per week (guarded
   * by state.lastAutoCarry). Returns how many cards were moved. */
  function autoCarryOver() {
    var thisMonday = mondayOf(new Date());
    var thisKey = keyOf(thisMonday);
    if (state.lastAutoCarry === thisKey) return 0;

    if (!state.weeks[thisKey]) state.weeks[thisKey] = emptyWeek();
    var carried = [];
    Object.keys(state.weeks).forEach(function (wk) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(wk);
      if (!m) return;
      var monday = new Date(+m[1], +m[2] - 1, +m[3]);
      if (!(monday < thisMonday)) return; // only weeks before this one
      var wobj = state.weeks[wk];
      DAYS.forEach(function (d) {
        var keep = [];
        (wobj[d.key] || []).forEach(function (c) {
          if (c.done) { keep.push(c); return; }
          c.carriedOver = true;
          c.carryCount = (c.carryCount || 0) + 1;
          carried.push(c);
        });
        wobj[d.key] = keep;
      });
    });

    if (carried.length) {
      state.weeks[thisKey].mon = carried.concat(state.weeks[thisKey].mon);
    }
    state.lastAutoCarry = thisKey;
    save();
    return carried.length;
  }

  function tagClass(tag) {
    var idx = state.tagColors[tag];
    return 'tc' + (idx === undefined ? 7 : idx);
  }

  function knownTags() {
    return Object.keys(state.tagColors).sort();
  }

  function emptyWeek() {
    return { mon: [], tue: [], wed: [], thu: [], fri: [] };
  }

  async function load() {
    try {
      if (window.boardAPI) {
        var s = await window.boardAPI.loadState();
        if (s && s.weeks) return s;
      } else {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      }
    } catch (e) { /* storage unavailable */ }
    return seed();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable */ }
    if (window.boardAPI) window.boardAPI.saveState(JSON.parse(JSON.stringify(state)));
  }

  /* 공휴일은 메인 프로세스가 번들 + 월 1회 갱신으로 관리한다.
   * 브라우저(아티팩트)에서 열면 공휴일 없이 동작한다. */
  async function loadHolidays() {
    try {
      if (window.boardAPI && window.boardAPI.loadHolidays) {
        var d = await window.boardAPI.loadHolidays();
        if (d && d.days) return d.days;
      }
    } catch (e) { /* 공휴일은 없어도 보드는 돌아간다 */ }
    return {};
  }

  function seed() {
    var wk = keyOf(mondayOf(new Date()));
    var s = { weeks: {}, longterm: [], schedules: [], vacation: {}, hideDone: false };
    s.weeks[wk] = emptyWeek();
    s.weeks[wk].mon.push(card('주간 업무 계획 정리', '이번 주 우선순위 확인 후 카드로 등록', 'mid', '계획'));
    s.weeks[wk].mon.push(card('팀 주간회의', '오전 10시 · 회의실 A', 'high', '회의'));
    s.weeks[wk].wed.push(card('거래처 견적서 발송', '', 'mid', '영업'));
    s.weeks[wk].fri.push(card('주간 보고서 제출', '금요일 오후 5시까지', 'high', '보고', keyOf(addDays(mondayOf(new Date()), 4))));
    s.longterm.push(card('4분기 사업계획 초안', '9월 말까지 · 자료 조사부터', 'low', '장기'));
    s.longterm.push(card('업무 매뉴얼 정비', '틈날 때 조금씩 업데이트', 'low', '장기'));
    return s;
  }

  function card(title, memo, prio, tag, due) {
    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title,
      memo: memo || '',
      prio: prio || 'low',
      tag: tag || '',
      due: due || '',
      done: false,
      subs: [],
      createdAt: new Date().toISOString()
    };
  }

  function week() {
    var wk = keyOf(viewMonday);
    if (!state.weeks[wk]) state.weeks[wk] = emptyWeek();
    return state.weeks[wk];
  }

  function getList(listKey) {
    return listKey === 'long' ? state.longterm : week()[listKey];
  }

  function findCard(id) {
    var w = week();
    for (var i = 0; i < DAYS.length; i++) {
      var arr = w[DAYS[i].key];
      for (var j = 0; j < arr.length; j++) {
        if (arr[j].id === id) return { list: DAYS[i].key, index: j, card: arr[j] };
      }
    }
    for (var k = 0; k < state.longterm.length; k++) {
      if (state.longterm[k].id === id) return { list: 'long', index: k, card: state.longterm[k] };
    }
    return null;
  }

  function moveCard(id, targetList, targetIndex) {
    var loc = findCard(id);
    if (!loc) return;
    var src = getList(loc.list);
    src.splice(loc.index, 1);
    var dst = getList(targetList);
    if (targetIndex === undefined || targetIndex === null || targetIndex > dst.length) targetIndex = dst.length;
    if (loc.list === targetList && loc.index < targetIndex) targetIndex--;
    dst.splice(targetIndex, 0, loc.card);
    save();
    render();
  }

  /* ---------- render ---------- */
  var board = document.getElementById('board');
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];

  function dueInfo(c) {
    if (!c.due) return null;
    var parts = c.due.split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    if (isNaN(d.getTime())) return null;
    var today = new Date();
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var daysLeft = Math.round((d - t0) / 86400000);
    var label = (d.getMonth() + 1) + '.' + d.getDate() + '(' + DOW_KO[d.getDay()] + ')';
    var text;
    if (daysLeft < 0) text = label + ' · ' + (-daysLeft) + '일 지남';
    else if (daysLeft === 0) text = label + ' · 오늘 마감';
    else if (daysLeft === 1) text = label + ' · 내일 마감';
    else text = '~' + label;
    return { daysLeft: daysLeft, text: text, urgent: daysLeft <= 1 };
  }

  function cardHTML(c) {
    var due = dueInfo(c);
    var dueSoon = due && due.urgent && !c.done;
    var cls = 'card prio-' + c.prio + (c.done ? ' done' : '') + (dueSoon ? ' due-soon' : '');
    var h = '<div class="' + cls + '" draggable="true" data-id="' + c.id + '" title="클릭하여 편집">';
    h += '<div class="card-top">';
    h += '<input type="checkbox" class="card-check" ' + (c.done ? 'checked' : '') + ' aria-label="완료 표시">';
    h += '<div class="card-title">';
    if (c.prio !== 'low') h += '<span class="prio-dot" title="우선순위 ' + PRIO_LABEL[c.prio] + '"></span>';
    h += esc(c.title) + '</div></div>';
    if (c.memo) h += '<div class="card-memo">' + esc(c.memo) + '</div>';
    var subs = c.subs || [];
    if (c.tag || due || c.carriedOver || subs.length) {
      h += '<div class="card-meta">';
      if (subs.length) {
        var subDone = subs.filter(function (s) { return s.done; }).length;
        h += '<span class="sub-chip' + (subDone === subs.length ? ' all-done' : '') +
          '" title="하위 업무 ' + subs.length + '개 중 ' + subDone + '개 완료">☑ ' + subDone + '/' + subs.length + '</span>';
      }
      if (c.carriedOver) {
        var carryLabel = c.carryCount > 1 ? c.carryCount + '주 지연' : (c.carryCount === 1 ? '지난주 이월' : '이월');
        h += '<span class="carry-chip" title="완료하지 못해 이월된 업무입니다">⏳ ' + carryLabel + '</span>';
      }
      if (due) h += '<span class="due-chip' + (due.urgent && !c.done ? ' urgent' : '') + '">' + esc(due.text) + '</span>';
      if (c.tag) h += '<span class="tag ' + tagClass(c.tag) + '">' + esc(c.tag) + '</span>';
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function columnHTML(listKey, title, dateLabel, isToday, cards, holiday) {
    var visible = cards.filter(function (c) {
      if (state.hideDone && c.done) return false;
      if (tagFilter.size && !tagFilter.has(c.tag)) return false;
      return true;
    });
    var doneCount = cards.filter(function (c) { return c.done; }).length;
    var pct = cards.length ? Math.round(doneCount / cards.length * 100) : 0;

    var h = '<section class="col' + (isToday ? ' today' : '') + (holiday ? ' holiday' : '') +
      '" data-list="' + listKey + '">';
    h += '<div class="col-head"><span class="day">' + title + '</span>';
    if (dateLabel) h += '<span class="date">' + dateLabel + '</span>';
    if (isToday) h += '<span class="today-chip">오늘</span>';
    h += '<span class="count">' + doneCount + '/' + cards.length + '</span></div>';
    if (holiday) h += '<div class="col-holiday">' + esc(holiday) + '</div>';
    h += '<div class="col-progress"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="cardlist" data-list="' + listKey + '">';
    if (!visible.length) {
      h += '<div class="empty-hint">카드를 끌어오거나 추가하세요</div>';
    } else {
      visible.forEach(function (c) { h += cardHTML(c); });
    }
    h += '</div>';
    h += '<button class="add-btn" data-list="' + listKey + '">＋ 업무 추가</button>';
    h += '</section>';
    return h;
  }

  /* ---------- long-term categories ---------- */
  function cardsInCategory(cat) {
    return state.longterm.filter(function (c) {
      return cat === null ? !c.tag : c.tag === cat;
    });
  }

  function categoryGroupHTML(cat) {
    var isUncat = cat === null;
    var cards = cardsInCategory(cat);
    var visible = cards.filter(function (c) {
      if (state.hideDone && c.done) return false;
      if (tagFilter.size && !tagFilter.has(c.tag)) return false;
      return true;
    });
    var doneCount = cards.filter(function (c) { return c.done; }).length;
    var catAttr = isUncat ? '' : esc(cat);

    var h = '<div class="cat-group">';
    h += '<div class="cat-group-head">';
    h += isUncat ? '<span class="cat-group-label">미분류</span>' : '<span class="cat-pill ' + tagClass(cat) + '">' + esc(cat) + '</span>';
    h += '<span class="count">' + doneCount + '/' + cards.length + '</span>';
    if (!isUncat && !cards.length) {
      h += '<button type="button" class="cat-del" data-cat="' + catAttr + '" title="빈 카테고리 삭제">×</button>';
    }
    h += '</div>';
    h += '<div class="cardlist" data-list="long" data-cat="' + catAttr + '">';
    if (!visible.length) {
      h += '<div class="empty-hint">' + (isUncat ? '카테고리 없는 업무' : '비어 있음') + '</div>';
    } else {
      visible.forEach(function (c) { h += cardHTML(c); });
    }
    h += '</div>';
    h += '<button class="add-btn" data-list="long" data-cat="' + catAttr + '">＋ 추가</button>';
    h += '</div>';
    return h;
  }

  function addCategoryHTML() {
    if (!addingCategory) {
      return '<button type="button" class="add-btn" id="addCategoryBtn">＋ 카테고리 추가</button>';
    }
    return '<form id="addCategoryForm">' +
      '<input type="text" id="newCategoryInput" maxlength="20" placeholder="카테고리 이름" autocomplete="off"></form>';
  }

  function longtermColumnHTML() {
    var total = state.longterm.length;
    var done = state.longterm.filter(function (c) { return c.done; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;

    var h = '<section class="col longterm" data-list="long">';
    h += '<div class="col-head"><span class="day">장기 업무</span><span class="count">' + done + '/' + total + '</span></div>';
    h += '<div class="col-progress"><i style="width:' + pct + '%"></i></div>';
    h += '<div class="cat-groups">';
    state.longtermCategories.forEach(function (cat) { h += categoryGroupHTML(cat); });
    h += categoryGroupHTML(null);
    h += '</div>';
    h += addCategoryHTML();
    h += '</section>';
    return h;
  }

  function render() {
    applyViewChrome();
    if (view === 'month') renderMonth();
    else renderWeek();
  }

  function renderWeek() {
    var today = new Date();
    var w = week();
    var h = '';
    DAYS.forEach(function (d, i) {
      var date = addDays(viewMonday, i);
      var isToday = sameDate(date, today);
      h += columnHTML(d.key, d.label + '요일', (date.getMonth() + 1) + '.' + date.getDate(),
        isToday, w[d.key], HOLIDAYS[keyOf(date)] || '');
    });
    h += '<div class="divider" aria-hidden="true"><i></i></div>';
    h += longtermColumnHTML();
    board.innerHTML = h;
    if (addingCategory) {
      var newCatInput = document.getElementById('newCategoryInput');
      if (newCatInput) newCatInput.focus();
    }

    // header
    var fri = addDays(viewMonday, 4);
    var isThisWeek = sameDate(viewMonday, mondayOf(today));
    var rangeText = viewMonday.getFullYear() + '년 ' + (viewMonday.getMonth() + 1) + '월 ' + viewMonday.getDate() + '일 – ';
    rangeText += (fri.getMonth() !== viewMonday.getMonth() ? (fri.getMonth() + 1) + '월 ' : '') + fri.getDate() + '일';
    document.getElementById('weekRange').innerHTML =
      esc(rangeText) + (isThisWeek ? '<span class="chip-now">이번 주</span>' : '') +
      '<small>' + (isThisWeek ? '월–금 주간 보드' : (viewMonday < mondayOf(today) ? '지난 주' : '다가오는 주')) + '</small>';

    // week stats
    var total = 0, done = 0;
    DAYS.forEach(function (d) {
      total += w[d.key].length;
      done += w[d.key].filter(function (c) { return c.done; }).length;
    });
    document.getElementById('weekStatText').textContent =
      total ? '이번 보드 ' + total + '개 중 ' + done + '개 완료' : '등록된 업무 없음';
    document.getElementById('weekStatBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';

    // carry-over availability: current week, weekday, and some past-day undone cards exist
    var carryBtn = document.getElementById('carryOver');
    var todayIdx = (today.getDay() + 6) % 7;
    var canCarry = false;
    if (isThisWeek && todayIdx >= 1 && todayIdx <= 4) {
      for (var i = 0; i < todayIdx; i++) {
        if (w[DAYS[i].key].some(function (c) { return !c.done; })) { canCarry = true; break; }
      }
    }
    carryBtn.disabled = !canCarry;

    document.getElementById('hideDone').checked = !!state.hideDone;

    renderTagFilter();
  }

  function renderTagFilter() {
    var box = document.getElementById('tagFilter');
    var w = week();
    var inUse = {};
    DAYS.forEach(function (d) {
      w[d.key].forEach(function (c) { if (c.tag) inUse[c.tag] = true; });
    });
    state.longterm.forEach(function (c) { if (c.tag) inUse[c.tag] = true; });
    var tags = Object.keys(inUse).sort();
    if (!tags.length) {
      box.innerHTML = '';
      tagFilter.clear();
      return;
    }
    // drop selections that no longer exist on this board
    tagFilter.forEach(function (t) { if (!inUse[t]) tagFilter.delete(t); });
    var h = '<span class="flabel">태그</span>';
    h += '<button class="fchip all' + (tagFilter.size ? '' : ' on') + '" data-tag="">전체</button>';
    tags.forEach(function (t) {
      h += '<button class="fchip ' + tagClass(t) + (tagFilter.has(t) ? ' on' : '') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    box.innerHTML = h;
  }

  document.getElementById('tagFilter').addEventListener('click', function (e) {
    var chip = e.target.closest('.fchip');
    if (!chip) return;
    var t = chip.dataset.tag;
    if (!t) tagFilter.clear();
    else if (tagFilter.has(t)) tagFilter.delete(t);
    else tagFilter.add(t);
    render();
  });

  /* ---------- month board ----------
   * 월간 보드는 일정(미팅·납기 등) 관리용이다. 주간 보드의 업무는 요약만
   * 흘러들어오고(요일 칸 위치 기준 한일/할일 개수), 여기서 만든 일정은
   * 주간 보드에 전혀 추가되지 않는다. */
  var SCHED_TYPES = [
    { key: 'delivery', label: '납기', cls: 'sc-delivery' },
    { key: 'meeting', label: '미팅', cls: 'sc-meeting' },
    { key: 'trip', label: '출장', cls: 'sc-trip' },
    { key: 'vacation', label: '휴가', cls: 'sc-vacation' },
    { key: 'etc', label: '기타', cls: 'sc-etc' }
  ];
  var calGrid = document.getElementById('calGrid');
  var ddayStrip = document.getElementById('ddayStrip');

  function schedType(k) {
    for (var i = 0; i < SCHED_TYPES.length; i++) {
      if (SCHED_TYPES[i].key === k) return SCHED_TYPES[i];
    }
    return SCHED_TYPES[SCHED_TYPES.length - 1];
  }
  function parseKey(k) {
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function schedEnd(s) { return s.end || s.start; }
  function schedSort(a, b) {
    if (a.start !== b.start) return a.start < b.start ? -1 : 1;
    var at = a.time || '99:99', bt = b.time || '99:99';
    if (at !== bt) return at < bt ? -1 : 1;
    return a.title < b.title ? -1 : 1;
  }
  /* 목–월 연차처럼 주말·공휴일에 걸친 휴가는 그 날들을 차감하지 않으므로(leaveDays)
   * 달력·상세 패널에도 띄우지 않는다. 단 시작일은 off day여도 남겨 둬야
   * 잘못 등록한 토요일 연차를 열어서 고치거나 지울 수 있다. */
  function leaveSkipsDay(s, dateKey) {
    return s.type === 'vacation' && dateKey !== s.start && isOffDay(parseKey(dateKey));
  }
  function schedulesOn(dateKey) {
    return state.schedules.filter(function (s) {
      if (s.start > dateKey || dateKey > schedEnd(s)) return false;
      return !leaveSkipsDay(s, dateKey);
    }).sort(schedSort);
  }
  function schedRangeText(s) {
    var a = parseKey(s.start), b = parseKey(schedEnd(s));
    return (a.getMonth() + 1) + '.' + a.getDate() + ' ~ ' + (b.getMonth() + 1) + '.' + b.getDate();
  }

  /* 그 날짜의 요일 칸에 놓인 카드만 집계한다(주말은 주간 보드에 열이 없음) */
  function daySummary(d) {
    var idx = (d.getDay() + 6) % 7;
    if (idx > 4) return { done: 0, todo: 0, cards: [] };
    var w = state.weeks[keyOf(mondayOf(d))];
    var cards = w ? (w[DAYS[idx].key] || []) : [];
    var done = 0;
    cards.forEach(function (c) { if (c.done) done++; });
    return { done: done, todo: cards.length - done, cards: cards };
  }
  function longtermDueOn(dateKey) {
    return state.longterm.filter(function (c) { return c.due === dateKey; });
  }

  /* ---------- 휴가(연차·반차) 카운팅 ----------
   * 휴가는 '휴가' 유형 일정으로 등록하고, 연차 1일 / 반차 0.5일로 센다.
   * 기준 잔여일(state.vacation['YYYY'])은 수기 입력값이고, 남은 일수는
   * 거기서 그 해에 등록한 휴가 합계를 뺀 값이다. */
  function leaveLabel(s) { return s.leave === 'half' ? '반차' : '연차'; }
  function fmtDays(n) {
    return (Math.round(n * 2) / 2).toFixed(1).replace(/\.0$/, '');
  }
  /* 주말과 공휴일은 연차를 쓰지 않는 날 */
  function isOffDay(d) {
    var dow = d.getDay();
    return dow === 0 || dow === 6 || !!HOLIDAYS[keyOf(d)];
  }
  /* 반차는 시작일 하루만 0.5일. 연차는 기간 중 근무일만 1일씩 */
  function leaveDays(s) {
    if (s.type !== 'vacation') return [];
    if (s.leave === 'half') {
      return isOffDay(parseKey(s.start)) ? [] : [{ key: s.start, amount: 0.5 }];
    }
    var out = [], d = parseKey(s.start), end = parseKey(schedEnd(s));
    while (d <= end && out.length < 400) {
      if (!isOffDay(d)) out.push({ key: keyOf(d), amount: 1 });
      d = addDays(d, 1);
    }
    return out;
  }
  function leaveUsed(prefix) { // prefix: 'YYYY' 또는 'YYYY-MM'
    var sum = 0;
    state.schedules.forEach(function (s) {
      leaveDays(s).forEach(function (x) {
        if (x.key.slice(0, prefix.length) === prefix) sum += x.amount;
      });
    });
    return sum;
  }
  function leaveOn(dateKey) { return leaveUsed(dateKey); }
  /* 오늘을 기준으로 이미 쓴 휴가(사용)와 앞으로 쓸 휴가(예정)를 나눈다.
   * 오늘 당일은 쓰고 있는 중이라 '사용' 쪽. 남은 일수는 둘 다 뺀 값이라
   * 합계(total)는 leaveUsed(prefix)와 같다. */
  function leaveSplit(prefix) {
    var today = keyOf(new Date()), used = 0, planned = 0;
    state.schedules.forEach(function (s) {
      leaveDays(s).forEach(function (x) {
        if (x.key.slice(0, prefix.length) !== prefix) return;
        if (x.key <= today) used += x.amount; else planned += x.amount;
      });
    });
    return { used: used, planned: planned, total: used + planned };
  }
  function vacBase(year) {
    var v = state.vacation[String(year)];
    return typeof v === 'number' && isFinite(v) ? v : null;
  }

  function calCellHTML(d, inMonth, today) {
    var k = keyOf(d);
    var sum = daySummary(d);
    var lt = longtermDueOn(k);
    var scheds = schedulesOn(k);
    var vac = leaveOn(k);
    var hol = HOLIDAYS[k] || '';
    var dow = d.getDay();
    var isToday = sameDate(d, today);
    var cls = 'cal-cell';
    if (!inMonth) cls += ' other';
    if (dow === 0 || dow === 6) cls += ' weekend';
    if (vac) cls += ' vac';
    if (hol) cls += ' holiday';
    if (isToday) cls += ' today';

    var h = '<div class="' + cls + '" data-date="' + k + '" title="' +
      esc(hol ? hol + ' · 클릭하여 상세 보기' : '클릭하여 상세 보기') + '">';
    h += '<div class="cal-daynum"><span>' + d.getDate() + '</span>';
    if (isToday) h += '<span class="today-chip">오늘</span>';
    if (hol) h += '<span class="hol-name">' + esc(hol) + '</span>';
    h += '</div>';
    if (sum.done || sum.todo || lt.length) {
      h += '<div class="cal-stats">';
      if (sum.done) h += '<span class="stat-done" title="한 일 ' + sum.done + '건"><i></i>' + sum.done + '</span>';
      if (sum.todo) h += '<span class="stat-todo" title="할 일 ' + sum.todo + '건"><i></i>' + sum.todo + '</span>';
      if (lt.length) h += '<span class="stat-lt" title="마감 예정 장기 업무 ' + lt.length + '건">◇' + lt.length + '</span>';
      h += '</div>';
    }
    // 2줄만 미리 보여주므로 휴가는 가려지지 않게 앞으로 당긴다
    var preview = scheds.slice().sort(function (a, b) {
      return (b.type === 'vacation' ? 1 : 0) - (a.type === 'vacation' ? 1 : 0);
    });
    preview.slice(0, 2).forEach(function (s) {
      var t = schedType(s.type);
      var cont = s.start < k; // 여러 날 걸친 일정의 둘째 날부터
      var pre = '';
      if (s.type === 'vacation' && s.title.indexOf(leaveLabel(s)) !== 0) pre = leaveLabel(s) + ' · ';
      // data-day = 잡은 날. 드롭할 때 이 날이 놓은 날로 가도록 전체를 민다(moveSchedule)
      var tip = t.label + ' · ' + s.title;
      tip += (s.end && s.end !== s.start)
        ? ' · ' + schedRangeText(s) + ' · 드래그하면 이 날 기준으로 통째로 이동'
        : ' · 드래그하여 이동';
      h += '<div class="sched-bar ' + t.cls + '" draggable="true" data-sid="' + s.id +
        '" data-day="' + k + '" title="' + esc(tip) + '">' +
        (cont ? '… ' : '') + (s.time ? esc(s.time) + ' ' : '') + esc(pre + s.title) + '</div>';
    });
    if (scheds.length > 2) h += '<div class="sched-more">+' + (scheds.length - 2) + '건 더</div>';
    h += '</div>';
    return h;
  }

  function monthSummaryText(y, m) {
    var lastDay = new Date(y, m + 1, 0).getDate();
    var total = 0, done = 0;
    for (var i = 1; i <= lastDay; i++) {
      var s = daySummary(new Date(y, m, i));
      total += s.done + s.todo;
      done += s.done;
    }
    var mk = y + '-' + String(m + 1).padStart(2, '0');
    var sch = state.schedules.filter(function (x) {
      return x.start.slice(0, 7) <= mk && schedEnd(x).slice(0, 7) >= mk;
    }).length;
    var vac = leaveUsed(mk);
    return '업무 ' + done + '/' + total + ' · 일정 ' + sch + '건' +
      (vac ? ' · 휴가 ' + fmtDays(vac) + '일' : '');
  }

  /* 상단 휴가 카운터: 보고 있는 달의 연도 기준.
   * 사용(오늘까지)과 예정(내일부터)을 따로 보여 주고, '남음'은 둘 다 뺀 값. */
  var vacChip = document.getElementById('vacChip');
  function renderVacation() {
    var y = viewMonth.getFullYear();
    var sp = leaveSplit(String(y));
    var base = vacBase(y);
    vacChip.classList.remove('low', 'over', 'unset');
    var detail = '사용 ' + fmtDays(sp.used) +
      ' · <span class="plan">예정 ' + fmtDays(sp.planned) + '</span>';
    if (base === null) {
      vacChip.classList.add('unset');
      vacChip.innerHTML = '<span class="lbl">' + y + ' 휴가</span>' +
        '<span class="num">잔여 입력</span>' +
        (sp.total ? '<span class="sub">' + detail + '</span>' : '');
      vacChip.title = y + '년 기준 잔여 휴가를 입력하세요';
      return;
    }
    var left = base - sp.total;
    if (left <= 0) vacChip.classList.add('over');
    else if (left <= 1) vacChip.classList.add('low');
    vacChip.innerHTML = '<span class="lbl">' + y + ' 휴가</span>' +
      '<span class="num">' + fmtDays(left) + '</span><span class="unit">일 남음</span>' +
      '<span class="sub">기준 ' + fmtDays(base) + ' · ' + detail + '</span>';
    vacChip.title = y + '년 기준 ' + fmtDays(base) + '일 · 사용 ' + fmtDays(sp.used) +
      '일 · 예정 ' + fmtDays(sp.planned) + '일 · 남음 ' + fmtDays(left) +
      '일(사용·예정 모두 뺀 값) · 클릭하여 기준값 수정';
  }

  function renderMonth() {
    var today = new Date();
    var y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    var last = new Date(y, m + 1, 0);
    var cells = [];
    var cur = sundayOf(new Date(y, m, 1)); // 일요일 시작
    while (cells.length < 42) {
      cells.push(cur);
      cur = addDays(cur, 1);
      if (cur > last && cells.length % 7 === 0) break;
    }
    var h = '';
    cells.forEach(function (d) { h += calCellHTML(d, d.getMonth() === m, today); });
    calGrid.innerHTML = h;

    var isThisMonth = today.getFullYear() === y && today.getMonth() === m;
    document.getElementById('monthRange').innerHTML =
      y + '년 ' + (m + 1) + '월' + (isThisMonth ? '<span class="chip-now">이번 달</span>' : '') +
      '<small>' + esc(monthSummaryText(y, m)) + '</small>';

    renderVacation();
    renderDday();
  }

  function renderDday() {
    var today = new Date();
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var tk = keyOf(t0);
    var list = state.schedules.filter(function (s) { return schedEnd(s) >= tk; })
      .sort(schedSort).slice(0, 5);
    if (!list.length) {
      ddayStrip.innerHTML = '<span class="dday-empty">다가오는 일정이 없습니다</span>';
      return;
    }
    var h = '<span class="flabel">다가오는 일정</span>';
    list.forEach(function (s) {
      var t = schedType(s.type);
      var left = Math.round((parseKey(s.start) - t0) / 86400000);
      var badge = left > 0 ? 'D-' + left : (left === 0 ? 'D-DAY' : '진행 중');
      h += '<button type="button" class="dday-item' + (left <= 3 ? ' soon' : '') +
        '" data-date="' + (s.start < tk ? tk : s.start) + '" title="' + esc(s.title) + '">' +
        '<span class="dday-badge">' + badge + '</span>' +
        '<span class="dday-type ' + t.cls + '">' + t.label + '</span>' +
        '<span class="ttl">' + esc(s.title) + '</span></button>';
    });
    ddayStrip.innerHTML = h;
  }

  calGrid.addEventListener('click', function (e) {
    var cell = e.target.closest('.cal-cell');
    if (cell) openDayPanel(cell.dataset.date);
  });

  /* ---------- 일정 드래그 이동 ----------
   * "잡은 날이 놓은 날로 간다" — 3일짜리를 첫날에서 끌면 놓은 날부터 3일,
   * 가운데 날에서 끌면 놓은 날 앞뒤로 하루씩. 바가 손에서 미끄러지지 않아
   * 예측이 쉽다. (날짜만 민다. 유형·반차 여부·시간은 건드리지 않는다.)
   *
   * 길이를 무엇으로 재느냐는 유형에 따라 다르다:
   *  - 일반 일정(출장·미팅 등)은 **달력 간격**. 3일 출장은 주말이 껴도 3일.
   *  - 연차는 **근무일 수**. 3일 연차는 어디로 옮겨도 3일 차감이어야 하므로
   *    주말·공휴일을 건너뛰며 끝날을 다시 잡는다. */
  var schedDrag = null; // { id, day }
  var dropPaint = null; // 마지막으로 칠한 날 — dragover가 쉴 새 없이 들어온다

  function findSched(id) {
    for (var i = 0; i < state.schedules.length; i++) {
      if (state.schedules[i].id === id) return state.schedules[i];
    }
    return null;
  }
  function dayDelta(fromKey, toKey) {
    return Math.round((parseKey(toKey) - parseKey(fromKey)) / 86400000);
  }
  /* 쉬는 날을 건너뛴 다음(step 1)/이전(step -1) 근무일 */
  function nextWorkday(d, step) {
    var x = d;
    for (var i = 0; i < 400; i++) {
      x = addDays(x, step);
      if (!isOffDay(x)) return x;
    }
    return d;
  }
  /* 연차를 옮길 때 잡히는 새 기간. 달력 간격이 아니라 **근무일 수**를 보존한다 —
   * 12/17~12/21(목·금·월 = 3일)을 24일로 끌면 25일 성탄절과 주말을 건너뛰어
   * 12/24~12/29(24·28·29 = 3일)가 된다. 달력 간격으로 밀면 12/24~12/28이 되어
   * 2일로 줄고, 12/7로 끌면 월–금 5일이 통째로 연차가 돼 버린다.
   * 잡은 날이 앞에서 몇 번째 근무일이었는지도 그대로 유지한다. */
  function movedLeaveRange(s, grabKey, dropKey) {
    var days = leaveDays(s).map(function (x) { return x.key; });
    if (!days.length) return null; // 차감되는 날이 없는 휴가 — 그냥 민다
    var before = 0; // 잡은 날 앞에 있던 근무일 수
    days.forEach(function (k) { if (k < grabKey) before++; });
    var a = parseKey(dropKey);
    if (isOffDay(a)) a = nextWorkday(a, 1); // 쉬는 날에 놓으면 다음 근무일부터
    var b = a, i;
    for (i = 0; i < before; i++) a = nextWorkday(a, -1);
    for (i = 0; i < days.length - 1 - before; i++) b = nextWorkday(b, 1);
    var sk = keyOf(a), ek = keyOf(b);
    return { start: sk, end: sk === ek ? '' : ek };
  }
  /* 놓았을 때 잡힐 기간. 미리보기와 실제 이동이 같은 답을 쓰도록 한 군데로 모은다 */
  function schedMoveTarget(s, grabKey, dropKey) {
    if (s.type === 'vacation') {
      var v = movedLeaveRange(s, grabKey, dropKey);
      if (v) return v;
    }
    var delta = dayDelta(grabKey, dropKey);
    return {
      start: keyOf(addDays(parseKey(s.start), delta)),
      end: s.end ? keyOf(addDays(parseKey(schedEnd(s)), delta)) : ''
    };
  }
  function clearSchedDrop() {
    dropPaint = null;
    calGrid.classList.remove('sd-on');
    calGrid.querySelectorAll('.sd-range, .sd-target').forEach(function (el) {
      el.classList.remove('sd-range', 'sd-target');
    });
  }
  /* 놓기 전에 어느 칸이 실제로 찰지 미리 칠해 준다. 연차가 걸치는 주말·공휴일은
   * 차감도 표시도 되지 않으므로(leaveSkipsDay) 미리보기에서도 빼야 결과와 맞는다 */
  function paintSchedDrop(targetKey) {
    if (dropPaint === targetKey) return;
    dropPaint = targetKey;
    var s = findSched(schedDrag.id);
    if (!s) return;
    var r = schedMoveTarget(s, schedDrag.day, targetKey);
    var moved = { type: s.type, leave: s.leave, start: r.start, end: r.end };
    var endK = r.end || r.start;
    calGrid.querySelectorAll('.cal-cell').forEach(function (el) {
      var k = el.dataset.date;
      el.classList.toggle('sd-range', k >= r.start && k <= endK && !leaveSkipsDay(moved, k));
      el.classList.toggle('sd-target', k === targetKey);
    });
  }
  function moveSchedule(id, fromKey, toKey) {
    var s = findSched(id);
    if (!s) return;
    var r = schedMoveTarget(s, fromKey, toKey);
    if (r.start === s.start && r.end === (s.end || '')) return;
    s.start = r.start;
    s.end = r.end;
    save();
    render();
    var d = parseKey(s.start);
    var where = s.end ? schedRangeText(s) : (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    // 휴가는 차감 일수와 잔여까지 같이 알려 준다
    toast(s.type === 'vacation'
      ? vacToast(s, where + '로 이동')
      : '일정을 ' + where + '로 옮겼습니다');
  }

  calGrid.addEventListener('dragstart', function (e) {
    var bar = e.target.closest('.sched-bar[data-sid]');
    if (!bar) return;
    schedDrag = { id: bar.dataset.sid, day: bar.dataset.day };
    bar.classList.add('dragging');
    calGrid.classList.add('sd-on');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', bar.dataset.sid); } catch (err) {}
  });

  calGrid.addEventListener('dragover', function (e) {
    if (!schedDrag) return;
    var cell = e.target.closest('.cal-cell');
    if (!cell) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    paintSchedDrop(cell.dataset.date);
  });

  calGrid.addEventListener('drop', function (e) {
    if (!schedDrag) return;
    var cell = e.target.closest('.cal-cell');
    if (!cell) return;
    e.preventDefault();
    moveSchedule(schedDrag.id, schedDrag.day, cell.dataset.date);
    schedDrag = null;
    clearSchedDrop(); // render()로 칸이 새로 그려지므로 dragend를 기다리지 않는다
  });

  calGrid.addEventListener('dragend', function () {
    schedDrag = null;
    calGrid.querySelectorAll('.sched-bar.dragging').forEach(function (el) {
      el.classList.remove('dragging');
    });
    clearSchedDrop();
  });
  ddayStrip.addEventListener('click', function (e) {
    var item = e.target.closest('.dday-item');
    if (item) openDayPanel(item.dataset.date);
  });

  /* ---------- view switching ---------- */
  function applyViewChrome() {
    var isMonth = view === 'month';
    var tabW = document.getElementById('tabWeek');
    var tabM = document.getElementById('tabMonth');
    tabW.classList.toggle('on', !isMonth);
    tabM.classList.toggle('on', isMonth);
    tabW.setAttribute('aria-selected', isMonth ? 'false' : 'true');
    tabM.setAttribute('aria-selected', isMonth ? 'true' : 'false');
    document.getElementById('weekNav').style.display = isMonth ? 'none' : '';
    document.getElementById('monthNav').style.display = isMonth ? '' : 'none';

  /* ---------- day detail panel ---------- */
  var dayOverlay = document.getElementById('dayOverlay');
  var dayPanel = document.getElementById('dayPanel');
  var panelDate = null;

  /* 패널에 뜨는 카드는 현재 보고 있는 주가 아닐 수도 있어 전체에서 찾는다 */
  function findCardGlobal(id) {
    var wks = Object.keys(state.weeks);
    for (var i = 0; i < wks.length; i++) {
      for (var j = 0; j < DAYS.length; j++) {
        var arr = state.weeks[wks[i]][DAYS[j].key] || [];
        for (var k = 0; k < arr.length; k++) if (arr[k].id === id) return arr[k];
      }
    }
    for (var n = 0; n < state.longterm.length; n++) {
      if (state.longterm[n].id === id) return state.longterm[n];
    }
    return null;
  }

  function dayCardRowHTML(c, extra) {
    var sub = [];
    if (extra) sub.push(extra);
    if (c.tag) sub.push(c.tag);
    if (c.prio !== 'low') sub.push('우선순위 ' + PRIO_LABEL[c.prio]);
    if (c.memo) sub.push(c.memo);
    var h = '<div class="day-row' + (c.done ? ' done' : '') + '" data-card="' + c.id + '">';
    h += '<input type="checkbox" class="card-check" ' + (c.done ? 'checked' : '') + ' aria-label="완료 표시">';
    h += '<span class="t">' + esc(c.title);
    if (sub.length) h += '<small>' + esc(sub.join(' · ')) + '</small>';
    h += '</span></div>';
    return h;
  }

  function renderDayPanel() {
    if (!panelDate) return;
    var d = parseKey(panelDate);
    var idx = (d.getDay() + 6) % 7;
    var sum = daySummary(d);
    var lt = longtermDueOn(panelDate);
    var scheds = schedulesOn(panelDate);

    var hol = HOLIDAYS[panelDate] || '';
    var h = '<div class="day-head"><h2>' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일</h2>';
    h += '<span class="dow">' + DOW_KO[d.getDay()] + '요일 · ' + d.getFullYear() + '년' +
      (sameDate(d, new Date()) ? ' · 오늘' : '') + '</span>';
    if (hol) h += '<span class="hol-badge">' + esc(hol) + '</span>';
    h += '</div>';

    var vac = leaveOn(panelDate);

    h += '<div class="day-sec"><div class="day-sec-head"><h3>일정</h3>' +
      (vac ? '<span class="leave-tag sc-vacation">휴가 ' + fmtDays(vac) + '일</span>' : '') +
      '<span class="count">' + scheds.length + '건</span></div>';
    if (!scheds.length) {
      h += '<div class="day-empty">등록된 일정이 없습니다</div>';
    } else {
      scheds.forEach(function (s) {
        var t = schedType(s.type);
        var meta = [];
        if (s.type === 'vacation') meta.push(leaveLabel(s) + ' · ' + (s.leave === 'half' ? '0.5일' : '1일'));
        if (s.time) meta.push(s.time);
        if (s.end && s.end !== s.start) meta.push(schedRangeText(s));
        if (s.memo) meta.push(s.memo);
        h += '<div class="day-row clickable" data-sched="' + s.id + '" title="클릭하여 편집">' +
          '<span class="dday-type ' + t.cls + '">' + t.label + '</span>' +
          '<span class="t">' + esc(s.title) +
          (meta.length ? '<small>' + esc(meta.join(' · ')) + '</small>' : '') +
          '</span></div>';
      });
    }
    h += '<button type="button" class="sub-add" id="dayAddSched">＋ 일정 추가</button>' +
      '<button type="button" class="sub-add" id="dayAddVac">＋ 휴가(연차·반차) 추가</button></div>';

    h += '<div class="day-sec"><div class="day-sec-head"><h3>주간 업무</h3>';
    if (idx <= 4) h += '<span class="count">' + sum.done + '/' + (sum.done + sum.todo) + '</span>';
    h += '</div>';
    if (idx > 4) {
      h += '<div class="day-empty">주말에는 주간 업무 열이 없습니다</div>';
    } else if (!sum.cards.length) {
      h += '<div class="day-empty">등록된 업무가 없습니다 · 주간 보드에서 추가하세요</div>';
    } else {
      sum.cards.forEach(function (c) { h += dayCardRowHTML(c, ''); });
    }
    h += '</div>';

    if (lt.length) {
      h += '<div class="day-sec"><div class="day-sec-head"><h3>장기 업무 마감</h3>' +
        '<span class="count">' + lt.length + '건</span></div>';
      lt.forEach(function (c) { h += dayCardRowHTML(c, '장기 업무'); });
      h += '</div>';
    }

    h += '<div class="modal-actions">' +
      '<button type="button" class="btn" id="dayGoWeek">이 주 보드 열기</button>' +
      '<span class="grow"></span>' +
      '<button type="button" class="btn" id="dayClose">닫기</button></div>';
    dayPanel.innerHTML = h;
  }

  /* 휴가일 때만 연차/반차를 묻고, 반차는 하루짜리라 종료일을 숨긴다.
   * autoTitle(유형을 직접 누르거나 새로 만들 때)이면 비어 있는 제목을 연차/반차로 채운다. */
  function syncLeaveFields(autoTitle) {
    var isVac = schedTypeValue() === 'vacation';
    var half = leaveValue() === 'half';
    sLeaveField.style.display = isVac ? '' : 'none';
    sEndField.style.display = isVac && half ? 'none' : '';

      (isVac ? '휴가' : '일정') + (editingSched ? ' 편집' : ' 추가');
    if (!autoTitle) return;
    var t = sTitle.value.trim();
    if (isVac) {
      if (!t || t === '연차' || t === '반차') sTitle.value = half ? '반차' : '연차';
    } else if (t === '연차' || t === '반차') {
      sTitle.value = '';
    }
  }

  function openSched(id, presetDate, presetType) {
    var s = id ? findSched(id) : null;
    editingSched = s;
    sTitle.value = s ? s.title : '';
    setSchedTypeValue(s ? s.type : (presetType || 'delivery'));
    setLeaveValue(s ? s.leave : 'full');
    sStart.value = s ? s.start : (presetDate || keyOf(new Date()));
    sEnd.value = s && s.end ? s.end : '';
    sTime.value = s && s.time ? s.time : '';
    sMemo.value = s && s.memo ? s.memo : '';
    sDelete.style.display = s ? '' : 'none';
    syncLeaveFields(!s);
    schedOverlay.classList.add('open');
    setTimeout(function () { sTitle.focus(); sTitle.select(); }, 0);
  }
  function closeSched() {
    schedOverlay.classList.remove('open');
    editingSched = null;
  }

  function afterSchedChange() {
    save();
    closeSched();
    if (dayOverlay.classList.contains('open')) renderDayPanel();
    render();

  schedForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = sTitle.value.trim();
    if (!title) { sTitle.focus(); return; }
    if (!sStart.value) { sStart.focus(); return; }
    var type = schedTypeValue();
    var leave = type === 'vacation' ? leaveValue() : '';
    var start = sStart.value;
    var end = leave === 'half' ? '' : (sEnd.value || '');
    if (end && end < start) { toast('종료일이 시작일보다 빠릅니다'); sEnd.focus(); return; }
    if (end === start) end = '';
    var saved;
    if (editingSched) {
      editingSched.title = title;
      editingSched.type = type;
      editingSched.leave = leave;
      editingSched.start = start;
      editingSched.end = end;
      editingSched.time = sTime.value || '';
      editingSched.memo = sMemo.value.trim();
      saved = editingSched;
      toast(type === 'vacation' ? vacToast(saved, '수정') : '일정을 수정했습니다');
    } else {
      saved = {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title,
        type: type,
        leave: leave,
        start: start,
        end: end,
        time: sTime.value || '',
        memo: sMemo.value.trim(),
        createdAt: new Date().toISOString()
      };
      state.schedules.push(saved);
      toast(type === 'vacation' ? vacToast(saved, '등록') : '일정을 추가했습니다');
    }
    afterSchedChange();
  });

  /* 휴가를 더하거나 고칠 때마다 남은 일수를 바로 알려 준다 */
  function vacToast(s, verb) {
    var used = 0;
    leaveDays(s).forEach(function (x) { used += x.amount; });
    var y = +s.start.slice(0, 4);
    var base = vacBase(y);
    var msg = leaveLabel(s) + ' ' + fmtDays(used) + '일을 ' + verb + '했습니다';
    if (base !== null) msg += ' · ' + y + '년 잔여 ' + fmtDays(base - leaveUsed(String(y))) + '일';
    return msg;
  }

  sDelete.addEventListener('click', function () {
    if (!editingSched) return;
    var wasVac = editingSched.type === 'vacation';
    var y = +editingSched.start.slice(0, 4);
    var i = state.schedules.indexOf(editingSched);
    if (i >= 0) state.schedules.splice(i, 1);
    var base = wasVac ? vacBase(y) : null;
    toast(wasVac && base !== null
      ? '휴가를 삭제했습니다 · ' + y + '년 잔여 ' + fmtDays(base - leaveUsed(String(y))) + '일'
      : '일정을 삭제했습니다');
    afterSchedChange();
  });
