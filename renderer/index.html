  /* ---------- drag & drop ---------- */
  var dragId = null;
  var indicator = document.createElement('div');
  indicator.className = 'drop-indicator';

  board.addEventListener('dragstart', function (e) {
    var el = e.target.closest('.card');
    if (!el) return;
    dragId = el.dataset.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });

  board.addEventListener('dragend', function () {
    dragId = null;
    if (indicator.parentNode) indicator.parentNode.removeChild(indicator);
    board.querySelectorAll('.dragging').forEach(function (el) { el.classList.remove('dragging'); });
    board.querySelectorAll('.cardlist.dragover').forEach(function (el) { el.classList.remove('dragover'); });
  });

  board.addEventListener('dragover', function (e) {
    var list = e.target.closest('.cardlist');
    if (!list || !dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    board.querySelectorAll('.cardlist.dragover').forEach(function (el) {
      if (el !== list) el.classList.remove('dragover');
    });
    list.classList.add('dragover');
    var after = afterElement(list, e.clientY);
    if (after) list.insertBefore(indicator, after);
    else list.appendChild(indicator);
  });

  board.addEventListener('drop', function (e) {
    var list = e.target.closest('.cardlist');
    if (!list || !dragId) return;
    e.preventDefault();
    var listKey = list.dataset.list;
    var arr = getList(listKey);
    var after = afterElement(list, e.clientY);
    var realIdx = after ? realIndexOf(arr, after.dataset.id) : arr.length;
    if (listKey === 'long') {
      var loc = findCard(dragId);
      if (loc) loc.card.tag = list.dataset.cat || '';
    }
    moveCard(dragId, listKey, realIdx);
    dragId = null;
  });

  function realIndexOf(arr, id) {
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i;
    return arr.length;
  }

  function afterElement(list, y) {
    var els = Array.prototype.slice.call(list.querySelectorAll('.card:not(.dragging)'));
    var closest = null, closestOffset = -Infinity;
    els.forEach(function (el) {
      var box = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = el; }
    });
    return closest;
  }

  function nextColor() {

  function tagUsage(tag) {
    var n = 0;
    var count = function (c) { if (c.tag === tag) n++; };
    Object.keys(state.weeks).forEach(function (wk) {
      DAYS.forEach(function (d) { (state.weeks[wk][d.key] || []).forEach(count); });
    });
    state.longterm.forEach(count);
    return n;
  }

  function renderTagPicker() {
    var tags = knownTags();
    var h = '';
    tags.forEach(function (t) {
      h += '<button type="button" class="' + tagClass(t) + '" data-tag="' + esc(t) + '">' + esc(t) +
        '<span class="tag-x" title="태그 삭제">×</span></button>';
    });
    fTagList.innerHTML = h;
    var s = '';
    for (var i = 0; i < TAG_COLORS; i++) {
      s += '<button type="button" class="swatch tc' + i + (i === selColor ? ' on' : '') + '" data-c="' + i + '" aria-label="색상 ' + (i + 1) + '"></button>';
    }
    fSwatches.innerHTML = s;
  }

  fTagList.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tag]');
    if (!b) return;
    var t = b.dataset.tag;
    if (e.target.closest('.tag-x')) {
      var used = tagUsage(t);
      if (used > 0) {
        toast('"' + t + '" 태그는 카드 ' + used + '개에서 사용 중이라 삭제할 수 없습니다');
      } else {
        delete state.tagColors[t];
        var ci = state.longtermCategories.indexOf(t);
        if (ci >= 0) state.longtermCategories.splice(ci, 1);
        save();
        if (fTag.value.trim() === t) fTag.value = '';
        renderTagPicker();
        toast('"' + t + '" 태그를 삭제했습니다');
      }
      return;
    }
    fTag.value = t;
    selColor = state.tagColors[t];
    if (selColor === undefined) selColor = nextColor();
    renderTagPicker();
  });

  fSwatches.addEventListener('click', function (e) {
    var b = e.target.closest('.swatch');
    if (!b) return;
    selColor = +b.dataset.c;
    renderTagPicker();
  });

  fTag.addEventListener('input', function () {
    var t = fTag.value.trim();
    if (t && state.tagColors[t] !== undefined) {
      selColor = state.tagColors[t];
      renderTagPicker();
    }
  });

  /* ---------- subtasks (modal) ---------- */
  var fSubs = document.getElementById('fSubs');
  var subDraft = []; // working copy; committed to the card only on save

  function subUid() {
    return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function renderSubs() {
    var h = '';
    subDraft.forEach(function (s, i) {
      h += '<div class="sub-row' + (s.done ? ' done' : '') + '" data-i="' + i + '">';
      h += '<input type="checkbox" class="sub-check" ' + (s.done ? 'checked' : '') + ' aria-label="하위 업무 완료">';
      h += '<input type="text" class="sub-text" maxlength="120" placeholder="하위 업무" value="' + esc(s.title) + '">';
      h += '<button type="button" class="sub-del" title="하위 업무 삭제">×</button>';
      h += '</div>';
    });
    fSubs.innerHTML = h;
  }

  function subIndexOf(el) {
    var row = el.closest('.sub-row');
    return row ? +row.dataset.i : -1;
  }

  function insertSub(at) {
    subDraft.splice(at, 0, { id: subUid(), title: '', done: false });
    renderSubs();
    var inputs = fSubs.querySelectorAll('.sub-text');
    if (inputs[at]) inputs[at].focus();
  }

  function collectSubs() {
    return subDraft.filter(function (s) { return s.title.trim(); })
      .map(function (s) { return { id: s.id, title: s.title.trim(), done: !!s.done }; });
  }

  document.getElementById('fSubAdd').addEventListener('click', function () {
    insertSub(subDraft.length);
  });

  fSubs.addEventListener('change', function (e) {
    var chk = e.target.closest('.sub-check');
    if (!chk) return;
    var i = subIndexOf(chk);
    if (i < 0) return;
    subDraft[i].done = chk.checked;
    // toggle in place so the text input keeps focus/caret
    chk.closest('.sub-row').classList.toggle('done', chk.checked);
  });

  fSubs.addEventListener('input', function (e) {
    var t = e.target.closest('.sub-text');
    if (!t) return;
    var i = subIndexOf(t);
    if (i >= 0) subDraft[i].title = t.value;
  });

  fSubs.addEventListener('click', function (e) {
    var del = e.target.closest('.sub-del');
    if (!del) return;
    var i = subIndexOf(del);
    if (i < 0) return;
    subDraft.splice(i, 1);
    renderSubs();
  });

  fSubs.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target.closest('.sub-text');
    if (!t) return;
    e.preventDefault(); // Enter adds the next row instead of saving the card
    insertSub(subIndexOf(t) + 1);
  });

  var fPrio = document.getElementById('fPrio');
  var fDelete = document.getElementById('fDelete');
  var editing = null; // { list, card } or { list, card: null }

  fPrio.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    fPrio.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
  });

  function prioValue() {
    var on = fPrio.querySelector('button.on');
    return on ? on.dataset.v : 'low';
  }
  function setPrio(v) {
    fPrio.querySelectorAll('button').forEach(function (x) {
      x.classList.toggle('on', x.dataset.v === v);
    });
  }

  function listName(k) {
    if (k === 'long') return '장기 업무';
    var d = DAYS.find(function (x) { return x.key === k; });
    return d ? d.label + '요일' : '';
  }

  function toggleDoneAtField() {
    fDoneAtField.style.display = fDone.checked ? '' : 'none';
    if (fDone.checked && !fDoneAt.value) fDoneAt.value = keyOf(new Date());
  }
  fDone.addEventListener('change', toggleDoneAtField);

  function openModal(listKey, cardObj, presetTag) {
    editing = { list: listKey, card: cardObj };
    document.getElementById('modalTitle').textContent =
      (cardObj ? '업무 편집' : '업무 추가') + ' · ' + listName(listKey);
    fTitle.value = cardObj ? cardObj.title : '';
    fMemo.value = cardObj ? cardObj.memo : '';
    subDraft = ((cardObj && cardObj.subs) || []).map(function (s) {
      return { id: s.id || subUid(), title: s.title || '', done: !!s.done };
    });
    renderSubs();
    fTag.value = cardObj ? cardObj.tag : (presetTag || '');
    fDue.value = cardObj ? (cardObj.due || '') : '';
    fDone.checked = cardObj ? !!cardObj.done : false;
    fDoneAt.value = cardObj && cardObj.doneAt ? String(cardObj.doneAt).slice(0, 10) : '';
    toggleDoneAtField();
    var tagForColor = cardObj ? cardObj.tag : presetTag;
    selColor = (tagForColor && state.tagColors[tagForColor] !== undefined)
      ? state.tagColors[tagForColor] : nextColor();
    renderTagPicker();
    setPrio(cardObj ? cardObj.prio : 'low');
    fDelete.style.display = cardObj ? '' : 'none';
    overlay.classList.add('open');
    setTimeout(function () { fTitle.focus(); }, 0);
  }

  function closeModal() {
    overlay.classList.remove('open');
    editing = null;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!editing) return;
    var title = fTitle.value.trim();
    if (!title) { fTitle.focus(); return; }
    var tagVal = fTag.value.trim();
    if (tagVal) state.tagColors[tagVal] = selColor;
    if (editing.card) {
      editing.card.title = title;
      editing.card.memo = fMemo.value.trim();
      editing.card.subs = collectSubs();
      editing.card.tag = fTag.value.trim();
      editing.card.prio = prioValue();
      editing.card.due = fDue.value || '';
      editing.card.done = fDone.checked;
      if (fDone.checked) editing.card.doneAt = fDoneAt.value || keyOf(new Date());
      else delete editing.card.doneAt;
      toast('수정했습니다');
    } else {
      var c = card(title, fMemo.value.trim(), prioValue(), fTag.value.trim(), fDue.value || '');
      c.subs = collectSubs();
      if (fDone.checked) { c.done = true; c.doneAt = fDoneAt.value || keyOf(new Date()); }
      getList(editing.list).push(c);
      toast(listName(editing.list) + '에 추가했습니다');
    }
    save();
    closeModal();
    render();
  });

  fDelete.addEventListener('click', function () {
    if (!editing || !editing.card) return;
    var loc = findCard(editing.card.id);
    if (loc) {
      getList(loc.list).splice(loc.index, 1);
      save();
      toast('삭제했습니다');
    }
    closeModal();
    render();
  });

  document.getElementById('fCancel').addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    // 위에 겹쳐 뜬 것부터 닫는다
    if (vacOverlay.classList.contains('open')) { closeVac(); return; }
    if (schedOverlay.classList.contains('open')) { closeSched(); return; }
    if (dayOverlay.classList.contains('open')) { closeDayPanel(); return; }
    if (overlay.classList.contains('open')) closeModal();
  });

  /* ---------- toolbar ---------- */
  document.getElementById('prevWeek').addEventListener('click', function () {
    viewMonday = addDays(viewMonday, -7); render();
  });
  document.getElementById('nextWeek').addEventListener('click', function () {
    viewMonday = addDays(viewMonday, 7); render();
  });
  document.getElementById('goToday').addEventListener('click', function () {
    viewMonday = mondayOf(new Date()); render();
  });
  document.getElementById('hideDone').addEventListener('change', function (e) {
    state.hideDone = e.target.checked; save(); render();
  });
  var openCsvBtn = document.getElementById('openCsv');
  if (window.boardAPI) {
    openCsvBtn.addEventListener('click', function () { window.boardAPI.openCsvFolder(); });
  } else {
    openCsvBtn.style.display = 'none';
  }
  document.getElementById('carryOver').addEventListener('click', function () {
    var today = new Date();
    var todayIdx = (today.getDay() + 6) % 7;
    if (todayIdx < 1 || todayIdx > 4) return;
    var w = week();
    var todayKey = DAYS[todayIdx].key;
    var moved = 0;
    for (var i = 0; i < todayIdx; i++) {
      var srcKey = DAYS[i].key;
      var keep = [];
      w[srcKey].forEach(function (c) {
        if (c.done) keep.push(c);
        else { c.carriedOver = true; w[todayKey].push(c); moved++; }
      });
      w[srcKey] = keep;
    }
    save();
    render();
    toast(moved ? '미완료 ' + moved + '개를 오늘로 옮겼습니다' : '이월할 업무가 없습니다');
  });

  /* ---------- theme switch ---------- */
  var THEME_KEY = 'weekly-board-theme';
  var themeSwitch = document.getElementById('themeSwitch');

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeSwitch.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
  }

  var storedTheme = null;
  try { storedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (storedTheme === 'dark' || storedTheme === 'light') {
    applyTheme(storedTheme);
  } else {
    var current = document.documentElement.getAttribute('data-theme');
    if (current !== 'dark' && current !== 'light') {
      current = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(current);
  }

  themeSwitch.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------- keep "today" correct across midnight ---------- */
  var lastCheckedDate = new Date();
  function checkDateRollover() {
    var now = new Date();
    if (sameDate(now, lastCheckedDate)) return;
    var wasFollowingThisWeek = sameDate(viewMonday, mondayOf(lastCheckedDate));
    var wasFollowingThisMonth = viewMonth.getFullYear() === lastCheckedDate.getFullYear() &&
      viewMonth.getMonth() === lastCheckedDate.getMonth();
    lastCheckedDate = now;
    if (wasFollowingThisWeek) viewMonday = mondayOf(now);
    if (wasFollowingThisMonth) viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    if (dragId) return;
    var n = autoCarryOver();
    render();
    if (n) toast('지난주 미완료 ' + n + '개를 이번 주 월요일로 이월했습니다');
  }
  setInterval(checkDateRollover, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkDateRollover();
  });
  window.addEventListener('focus', checkDateRollover);

  // 메인 프로세스가 공휴일을 새로 받아오면 다시 그린다(임시공휴일 지정 등)
  if (window.boardAPI && window.boardAPI.onHolidaysUpdated) {
    window.boardAPI.onHolidaysUpdated(function (d) {
      if (!d || !d.days) return;
      HOLIDAYS = d.days;
      render();
      if (dayOverlay.classList.contains('open')) renderDayPanel();
    });
  }

  render();
  if (initialCarry) toast('지난주 미완료 ' + initialCarry + '개를 이번 주 월요일로 이월했습니다');
})();
</script>
</body>
</html>
